
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 5 - JavaScript Basics</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <main>
        <h1>Assignment 5 - JavaScript Basics</h1>

        <section>
            <h2>Part 1: Profile Object and Calculations</h2>

            <p>Name: <span id="profileName"></span></p>
            <p>Birth Year: <span id="profileBirthYear"></span></p>
            <p>Is Developer: <span id="profileDeveloper"></span></p>
            <p>Age: <span id="profileAge"></span></p>
            <p>Total Hobbies: <span id="hobbiesCount"></span></p>
        </section>

        <section>
            <h2>Part 2: Form Input and Event Responses</h2>

            <form id="profileForm">
                <label for="username">Username:</label>
                <input type="text" id="username" required>

                <label for="birthYear">Birth Year:</label>
                <input type="number" id="birthYear" required>

                <button type="submit">Create / Update Profile</button>
            </form>
        </section>

        <section>
            <h2>Part 3: DOM List Manipulation</h2>

            <ul id="hobbyList"></ul>

            <button type="button" id="addItem">Add Item</button>
            <button type="button" id="removeItem">Remove Item</button>
        </section>
    </main>

</body>
</html>
